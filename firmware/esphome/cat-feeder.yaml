# Cat feeder — autonomous ESP32 node.
# Feeding logic runs here; Home Assistant and BLE are optional configuration channels.
# Pin map: hardware/pinout.md · Design: docs/plan.md

substitutions:
  name: cat-feeder
  friendly_name: Cat Feeder
  timezone: Europe/Rome
  # Slots are 0..2, cats 0..7: fed flags live in one bitmask (bit = cat * 3 + slot).
  max_cats: "1"

esphome:
  name: ${name}
  friendly_name: ${friendly_name}
  on_boot:
    priority: 600
    then:
      - ds1307.read_time:
          id: rtc

esp32:
  board: esp32dev
  framework:
    type: esp-idf

logger:
  level: DEBUG

# Autonomy: never reboot because Home Assistant or Wi-Fi is missing.
api:
  encryption:
    key: !secret api_encryption_key
  reboot_timeout: 0s

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  reboot_timeout: 0s

# No `ota:` block on purpose: firmware is flashed over USB.

i2c:
  sda: GPIO21
  scl: GPIO22
  scan: true

external_components:
  - source:
      type: local
      path: components
    components: [fdx_b, tmc2209_uart, ble_passkey]

uart:
  - id: uart_chip
    rx_pin: GPIO16            # WL-134 TX
    tx_pin: GPIO17            # loopback self-test only: jumper GPIO17 -> GPIO16
    baud_rate: 9600
  - id: uart_driver           # TMC2209 single-wire: TX via 1 kOhm, RX direct to PDN_UART
    tx_pin: GPIO27
    rx_pin: GPIO26
    baud_rate: 115200

# --- Microchip reader (WL-134, FDX-B 134.2 kHz) --------------------------------------
fdx_b:
  id: chip_reader
  uart_id: uart_chip
  last_tag:
    id: last_chip
    name: Last chip
  on_tag:
    - script.execute:
        id: on_chip
        chip: !lambda return x;

# --- Clock ---------------------------------------------------------------------------
# SNTP when online, DS3231 otherwise. Both set the system clock, so every time
# component (and the logic below) reads the same time.
time:
  - platform: ds1307          # DS3231 is register-compatible
    id: rtc
    timezone: ${timezone}
    update_interval: never
  - platform: sntp
    id: sys_time
    timezone: ${timezone}
    on_time_sync:
      then:
        - ds1307.write_time:
            id: rtc
    on_time:
      - seconds: 0
        minutes: 0
        hours: 0
        then:
          - globals.set:
              id: fed_bits
              value: "0"
          - logger.log: "Midnight: slot flags reset"

# --- State ---------------------------------------------------------------------------
globals:
  - id: fed_bits              # cat x slot "already fed" flags, survives reboots
    type: uint32_t
    restore_value: true
    initial_value: "0"
  - id: mm_per_ksteps         # learned level drop per 1000 motor steps
    type: float
    restore_value: true
    initial_value: "0"
  - id: last_override_ms
    type: uint32_t
    initial_value: "0"
  - id: level_before_mm
    type: float
    initial_value: "NAN"
  - id: jammed                # set by StallGuard via DIAG
    type: bool
    initial_value: "false"
  - id: move_started_ms
    type: uint32_t
    initial_value: "0"

# --- Motor ---------------------------------------------------------------------------
# Driver registers over UART; re-applied automatically after a driver power cycle.
tmc2209_uart:
  id: driver
  uart_id: uart_driver
  address: 0                  # MS1 = MS2 = GND
  rsense: 0.11                # typical StepStick module
  run_current: 0.8            # A rms
  microsteps: 8               # 1600 steps per auger turn
  stall_threshold: 60         # tune with "StallGuard result" while the auger turns
  sg_result:
    name: StallGuard result
    entity_category: diagnostic

# TMC2209 in STEP/DIR mode. EN is active low: the a4988 "sleep" pin, inverted,
# disables the driver at rest (silent, cool). Kibble in the flights holds the auger.
stepper:
  - platform: a4988
    id: auger
    step_pin: GPIO32
    dir_pin: GPIO33
    sleep_pin:
      number: GPIO25
      inverted: true
    max_speed: 800 steps/s
    acceleration: 400 steps/s^2
    deceleration: 400 steps/s^2

# --- Local configuration over BLE (nRF Connect) ------------------------------------------
# Every characteristic is UTF-8 text. Reads are open; writes need a paired client
# (static passkey on the device sticker). Layout: docs/ble-gatt.md
esp32_ble:
  name: ${name}
  io_capability: display_only
  auth_req_mode: sc_mitm_bond

ble_passkey:
  id: ble_auth
  passkey: !secret ble_passkey

esp32_ble_server:
  max_clients: 1
  services:
    - uuid: 6e3c0000-1a2b-4c5d-8e9f-0a1b2c3d4e5f
      advertise: true
      characteristics:
        - id: ble_dose
          uuid: 6e3c0001-1a2b-4c5d-8e9f-0a1b2c3d4e5f
          description: "Dose (steps)"
          read: true
          write: true
          value:
            data: "-"
          on_write:
            - script.execute:
                id: ble_write
                key: dose
                conn: !lambda return id;
                value: !lambda return std::string(x.begin(), x.end());
        - id: ble_override
          uuid: 6e3c0002-1a2b-4c5d-8e9f-0a1b2c3d4e5f
          description: "Override dose (steps, 0 = standard)"
          read: true
          write: true
          value:
            data: "-"
          on_write:
            - script.execute:
                id: ble_write
                key: override
                conn: !lambda return id;
                value: !lambda return std::string(x.begin(), x.end());
        - id: ble_low_level
          uuid: 6e3c0003-1a2b-4c5d-8e9f-0a1b2c3d4e5f
          description: "Low level threshold (%)"
          read: true
          write: true
          value:
            data: "-"
          on_write:
            - script.execute:
                id: ble_write
                key: low_level
                conn: !lambda return id;
                value: !lambda return std::string(x.begin(), x.end());
        - id: ble_pause
          uuid: 6e3c0004-1a2b-4c5d-8e9f-0a1b2c3d4e5f
          description: "Pause (0/1)"
          read: true
          write: true
          value:
            data: "-"
          on_write:
            - script.execute:
                id: ble_write
                key: pause
                conn: !lambda return id;
                value: !lambda return std::string(x.begin(), x.end());
        - id: ble_slots
          uuid: 6e3c0005-1a2b-4c5d-8e9f-0a1b2c3d4e5f
          description: "Slots HH:MM-HH:MM x3"
          read: true
          write: true
          value:
            data: "-"
          on_write:
            - script.execute:
                id: ble_write
                key: slots
                conn: !lambda return id;
                value: !lambda return std::string(x.begin(), x.end());
        - id: ble_chip1
          uuid: 6e3c0006-1a2b-4c5d-8e9f-0a1b2c3d4e5f
          description: "Authorized chip 1"
          read: true
          write: true
          value:
            data: "-"
          on_write:
            - script.execute:
                id: ble_write
                key: chip1
                conn: !lambda return id;
                value: !lambda return std::string(x.begin(), x.end());
        - id: ble_feed
          uuid: 6e3c0007-1a2b-4c5d-8e9f-0a1b2c3d4e5f
          description: "Feed now (empty or steps)"
          read: false
          write: true
          value:
            data: "-"
          on_write:
            - script.execute:
                id: ble_write
                key: feed
                conn: !lambda return id;
                value: !lambda return std::string(x.begin(), x.end());
        - id: ble_reset
          uuid: 6e3c0008-1a2b-4c5d-8e9f-0a1b2c3d4e5f
          description: "Reset slot flags (any value)"
          read: false
          write: true
          value:
            data: "-"
          on_write:
            - script.execute:
                id: ble_write
                key: reset
                conn: !lambda return id;
                value: !lambda return std::string(x.begin(), x.end());
        - id: ble_status
          uuid: 6e3c0009-1a2b-4c5d-8e9f-0a1b2c3d4e5f
          description: "Status"
          read: true
          write: false
          value:
            data: "-"

interval:
  - interval: 5s
    then:
      - script.execute: ble_refresh

# --- Configuration (persisted in flash, editable from HA and BLE) ---------------------
number:
  - platform: template
    id: dose_steps
    name: Dose
    icon: mdi:food-drumstick
    unit_of_measurement: steps
    mode: box
    min_value: 200
    max_value: 32000
    step: 100
    initial_value: 4800       # ~3 auger turns at 8 microsteps: calibrate on the bench
    optimistic: true
    restore_value: true
  - platform: template
    id: override_steps
    name: Override dose
    icon: mdi:hand-back-right
    unit_of_measurement: steps
    mode: box
    min_value: 0              # 0 = use the standard dose
    max_value: 32000
    step: 100
    initial_value: 0
    optimistic: true
    restore_value: false
  - platform: template
    id: low_level_pct
    name: Low level threshold
    entity_category: config
    unit_of_measurement: "%"
    mode: box
    min_value: 0
    max_value: 50
    step: 1
    initial_value: 10
    optimistic: true
    restore_value: true
  - platform: template
    id: empty_distance_mm
    name: Distance when empty
    entity_category: config
    unit_of_measurement: mm
    mode: box
    min_value: 50
    max_value: 600
    step: 1
    initial_value: 250
    optimistic: true
    restore_value: true
  - platform: template
    id: full_distance_mm
    name: Distance when full
    entity_category: config
    unit_of_measurement: mm
    mode: box
    min_value: 10
    max_value: 200
    step: 1
    initial_value: 30
    optimistic: true
    restore_value: true

  - platform: template
    id: stall_threshold
    name: Stall threshold
    entity_category: config
    mode: box
    min_value: 0
    max_value: 255
    step: 1
    initial_value: 60
    optimistic: true
    restore_value: true
    on_value:
      - lambda: id(driver).set_stall_threshold((uint8_t) x);

datetime:
  - platform: template
    id: slot1_start
    name: Slot 1 start
    type: time
    optimistic: true
    restore_value: true
    initial_value: "06:00:00"
  - platform: template
    id: slot1_end
    name: Slot 1 end
    type: time
    optimistic: true
    restore_value: true
    time_id: sys_time
    on_time:              # end of the slot: did every authorized cat eat?
      - script.execute:
          id: check_missed
          slot: 0
    initial_value: "11:59:59"
  - platform: template
    id: slot2_start
    name: Slot 2 start
    type: time
    optimistic: true
    restore_value: true
    initial_value: "12:00:00"
  - platform: template
    id: slot2_end
    name: Slot 2 end
    type: time
    optimistic: true
    restore_value: true
    time_id: sys_time
    on_time:              # end of the slot: did every authorized cat eat?
      - script.execute:
          id: check_missed
          slot: 1
    initial_value: "17:59:59"
  - platform: template
    id: slot3_start
    name: Slot 3 start
    type: time
    optimistic: true
    restore_value: true
    initial_value: "18:00:00"
  - platform: template
    id: slot3_end
    name: Slot 3 end
    type: time
    optimistic: true
    restore_value: true
    time_id: sys_time
    on_time:              # end of the slot: did every authorized cat eat?
      - script.execute:
          id: check_missed
          slot: 2
    initial_value: "23:59:59"

text:
  - platform: template
    id: chip_1
    name: Authorized chip 1
    icon: mdi:cat
    mode: text
    max_length: 20
    optimistic: true
    restore_value: true
    initial_value: ""

switch:
  - platform: template
    id: paused
    name: Pause
    icon: mdi:pause-circle
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
  - platform: template
    id: invert_auger
    name: Invert auger direction
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF

button:
  - platform: template
    name: Feed now
    icon: mdi:food
    on_press:
      - script.execute:
          id: manual_feed
          source: ha
          steps: 0
  - platform: template
    name: Forget BLE devices
    entity_category: config
    on_press:
      - lambda: id(ble_auth).clear_bonds();
  - platform: template
    name: Reset slot flags
    entity_category: config
    on_press:
      - globals.set:
          id: fed_bits
          value: "0"
  - platform: template
    name: "Test: send FDX-B frame"
    entity_category: diagnostic
    on_press:
      # Needs a jumper GPIO17 -> GPIO16 (reader disconnected). Sample ID 380123456789012.
      - lambda: |-
          auto frame = fdx_b::FdxBReader::build_frame(380, 123456789012ULL);
          id(uart_chip).write_array(frame.data(), frame.size());
  - platform: template
    name: "Test: authorized chip read"
    entity_category: diagnostic
    on_press:
      - script.execute:
          id: on_chip
          chip: !lambda return id(chip_1).state;

# --- Events to Home Assistant ----------------------------------------------------------
event:
  - platform: template
    id: feeder_event
    name: Feeder event
    event_types:
      - fed
      - manual_feed_ha
      - manual_feed_ble
      - hopper_empty
      - auger_jammed
      - time_invalid
      - slot_missed_1
      - slot_missed_2
      - slot_missed_3

# --- Stall detection ---------------------------------------------------------------------
# DIAG goes high on a StallGuard stall. Ignored during the first 500 ms of a move:
# StallGuard is unreliable while accelerating.
binary_sensor:
  - platform: gpio
    id: auger_stall
    name: Auger stall
    entity_category: diagnostic
    pin: GPIO34               # input only, driven push-pull by the TMC2209
    filters:
      - delayed_on: 20ms
    on_press:
      - lambda: |-
          bool moving = id(auger).current_position != id(auger).target_position;
          if (moving && millis() - id(move_started_ms) > 500) {
            id(jammed) = true;
            ESP_LOGW("feeder", "StallGuard: auger stalled");
          }

# --- Hopper level ----------------------------------------------------------------------
sensor:
  - platform: vl53l0x
    id: tof_distance
    name: Hopper distance
    entity_category: diagnostic
    address: 0x29
    update_interval: 10s
    unit_of_measurement: mm
    accuracy_decimals: 0
    filters:
      - multiply: 1000        # m -> mm
      - median:
          window_size: 5
          send_every: 1
          send_first_at: 1
  - platform: template
    id: level_mm
    name: Hopper level height
    entity_category: diagnostic
    unit_of_measurement: mm
    accuracy_decimals: 0
    update_interval: 10s
    lambda: |-
      float d = id(tof_distance).state;
      if (isnan(d)) return NAN;
      return std::max(0.0f, (float) id(empty_distance_mm).state - d);
  - platform: template
    id: level_pct
    name: Hopper level
    icon: mdi:silo
    unit_of_measurement: "%"
    accuracy_decimals: 0
    update_interval: 10s
    lambda: |-
      float d = id(tof_distance).state;
      float e = id(empty_distance_mm).state, f = id(full_distance_mm).state;
      if (isnan(d) || e <= f) return NAN;
      return clamp((e - d) / (e - f) * 100.0f, 0.0f, 100.0f);
  - platform: template
    id: doses_left
    name: Doses left
    icon: mdi:counter
    accuracy_decimals: 0
    update_interval: 60s
    lambda: |-
      float per_dose = id(mm_per_ksteps) * id(dose_steps).state / 1000.0f;
      if (isnan(id(level_mm).state) || per_dose <= 0) return NAN;
      return floorf(id(level_mm).state / per_dose);
  - platform: template
    id: last_steps
    name: Last dispensed steps
    entity_category: diagnostic
    unit_of_measurement: steps
    accuracy_decimals: 0
    update_interval: never

# --- Logic -----------------------------------------------------------------------------
script:
  # Turn the auger and verify. mark_bit >= 0 sets that fed flag on success.
  - id: dispense
    mode: single
    parameters:
      steps: int
      mark_bit: int
      event_type: string
    then:
      - lambda: |-
          id(level_before_mm) = id(level_mm).state;
          id(jammed) = false;
          id(move_started_ms) = millis();
      - stepper.report_position:
          id: auger
          position: 0
      - stepper.set_target:
          id: auger
          target: !lambda "return id(invert_auger).state ? -steps : steps;"
      - wait_until:
          condition:
            lambda: return id(auger).current_position == id(auger).target_position || id(jammed);
          timeout: 120s
      - if:
          condition:
            lambda: return id(jammed) || id(auger).current_position != id(auger).target_position;
          then:
            - stepper.set_target:
                id: auger
                target: !lambda return id(auger).current_position;
            # Back off a quarter turn (400 steps) to free the kibble.
            - stepper.set_target:
                id: auger
                target: !lambda "return id(auger).current_position + (id(invert_auger).state ? 400 : -400);"
            - wait_until:
                condition:
                  lambda: return id(auger).current_position == id(auger).target_position;
                timeout: 5s
            - event.trigger:
                id: feeder_event
                event_type: auger_jammed
            - logger.log:
                level: WARN
                format: "Auger stopped at %d of %d steps"
                args: [id(auger).current_position, steps]
          else:
            - lambda: |-
                if (mark_bit >= 0) id(fed_bits) |= (1u << mark_bit);
                id(last_steps).publish_state(steps);
                id(feeder_event).trigger(event_type);
            # Let the kibble settle, then learn the level drop per 1000 steps.
            - delay: 4s
            - component.update: tof_distance
            - delay: 1s
            - component.update: level_mm
            - lambda: |-
                float before = id(level_before_mm), after = id(level_mm).state;
                if (isnan(before) || isnan(after) || before <= after) return;
                float sample = (before - after) * 1000.0f / steps;
                float &avg = id(mm_per_ksteps);
                avg = avg <= 0 ? sample : avg * 0.8f + sample * 0.2f;
                ESP_LOGI("feeder", "Level drop %.1f mm, learned %.2f mm/1000 steps", before - after, avg);

  # Microchip read: automatic feeding with every check from docs/plan.md.
  - id: on_chip
    mode: single
    parameters:
      chip: string
    then:
      - lambda: |-
          if (id(paused).state) { ESP_LOGI("feeder", "Paused: ignoring chip"); return; }
          int cat = -1;
          const std::string authorized[] = { id(chip_1).state };
          for (int i = 0; i < ${max_cats}; i++)
            if (!authorized[i].empty() && chip == authorized[i]) cat = i;
          if (cat < 0) { ESP_LOGI("feeder", "Unknown chip %s", chip.c_str()); return; }

          auto now = id(sys_time).now();
          if (!now.is_valid()) {
            ESP_LOGW("feeder", "Clock not valid: automatic feeding suspended");
            id(feeder_event).trigger("time_invalid");
            return;
          }
          int m = now.hour * 60 + now.minute;
          auto in_slot = [m](datetime::TimeEntity *s, datetime::TimeEntity *e) {
            int a = s->hour * 60 + s->minute, b = e->hour * 60 + e->minute;
            return a <= b ? (m >= a && m <= b) : (m >= a || m <= b);
          };
          int slot = -1;
          if (in_slot(id(slot1_start), id(slot1_end))) slot = 0;
          else if (in_slot(id(slot2_start), id(slot2_end))) slot = 1;
          else if (in_slot(id(slot3_start), id(slot3_end))) slot = 2;
          if (slot < 0) { ESP_LOGI("feeder", "Outside feeding slots"); return; }

          int bit = cat * 3 + slot;
          if (id(fed_bits) & (1u << bit)) { ESP_LOGI("feeder", "Cat %d already fed in slot %d", cat, slot + 1); return; }

          float lvl = id(level_pct).state;
          if (!isnan(lvl) && lvl <= id(low_level_pct).state) {
            ESP_LOGW("feeder", "Hopper below threshold (%.0f%%)", lvl);
            id(feeder_event).trigger("hopper_empty");
            return;
          }
          if (isnan(lvl)) ESP_LOGW("feeder", "Level unknown: feeding anyway");

          ESP_LOGI("feeder", "Feeding cat %d, slot %d", cat, slot + 1);
          id(dispense).execute((int) id(dose_steps).state, bit, std::string("fed"));

  # Manual override from HA or BLE: skips chip, slot, flag, level, clock and pause.
  # StallGuard still applies; the slot flag is left untouched.
  - id: manual_feed
    mode: single
    parameters:
      source: string
      steps: int              # 0 = override dose if set, else standard dose
    then:
      - lambda: |-
          uint32_t t = millis();
          if (id(last_override_ms) != 0 && t - id(last_override_ms) < 10000) {
            ESP_LOGW("feeder", "Override ignored: cooldown");
            return;
          }
          id(last_override_ms) = t;
          int n = steps > 0 ? steps
                  : id(override_steps).state > 0 ? (int) id(override_steps).state
                                                 : (int) id(dose_steps).state;
          ESP_LOGI("feeder", "Manual feed from %s: %d steps", source.c_str(), n);
          id(dispense).execute(n, -1, std::string("manual_feed_") + source);

  # BLE writes from any characteristic land here: auth check, validation, apply.
  - id: ble_write
    mode: queued
    max_runs: 5
    parameters:
      key: string
      value: string
      conn: int
    then:
      - lambda: |-
          if (!id(ble_auth).is_authenticated(conn)) {
            ESP_LOGW("ble", "Write to '%s' refused: client not paired", key.c_str());
            return;
          }
          auto to_int = [](const std::string &str, int &out) {
            if (str.empty()) return false;
            char *end;
            long v = strtol(str.c_str(), &end, 10);
            if (*end != '\0') return false;
            out = (int) v;
            return true;
          };
          bool ok = false;
          int v = 0;
          if (key == "dose") {
            ok = to_int(value, v) && v >= 200 && v <= 32000;
            if (ok) id(dose_steps).make_call().set_value(v).perform();
          } else if (key == "override") {
            ok = to_int(value, v) && v >= 0 && v <= 32000;
            if (ok) id(override_steps).make_call().set_value(v).perform();
          } else if (key == "low_level") {
            ok = to_int(value, v) && v >= 0 && v <= 50;
            if (ok) id(low_level_pct).make_call().set_value(v).perform();
          } else if (key == "pause") {
            ok = value == "0" || value == "1";
            if (ok) {
              if (value == "1") id(paused).turn_on(); else id(paused).turn_off();
            }
          } else if (key == "slots") {
            int t[12];
            ok = sscanf(value.c_str(), "%d:%d-%d:%d,%d:%d-%d:%d,%d:%d-%d:%d", &t[0], &t[1], &t[2], &t[3],
                        &t[4], &t[5], &t[6], &t[7], &t[8], &t[9], &t[10], &t[11]) == 12;
            for (int i = 0; ok && i < 12; i += 2)
              ok = t[i] >= 0 && t[i] <= 23 && t[i + 1] >= 0 && t[i + 1] <= 59;
            if (ok) {
              datetime::TimeEntity *e[6] = {id(slot1_start), id(slot1_end), id(slot2_start),
                                            id(slot2_end), id(slot3_start), id(slot3_end)};
              for (int i = 0; i < 6; i++)
                e[i]->make_call().set_time(t[2 * i], t[2 * i + 1], (i % 2) ? 59 : 0).perform();
            }
          } else if (key == "chip1") {
            ok = value.size() <= 20 && std::all_of(value.begin(), value.end(), ::isdigit);
            if (ok) id(chip_1).make_call().set_value(value).perform();
          } else if (key == "feed") {
            ok = value.empty() || (to_int(value, v) && v > 0 && v <= 32000);
            if (ok) id(manual_feed).execute(std::string("ble"), value.empty() ? 0 : v);
          } else if (key == "reset") {
            ok = true;
            id(fed_bits) = 0;
          }
          if (ok) ESP_LOGI("ble", "%s <- '%s'", key.c_str(), value.c_str());
          else ESP_LOGW("ble", "Invalid value for %s: '%s'", key.c_str(), value.c_str());
      - script.execute: ble_refresh

  # Mirror the current state into the readable characteristics.
  - id: ble_refresh
    mode: restart
    then:
      - lambda: |-
          auto num = [](float f) { return isnan(f) ? std::string("?") : to_string((int) lroundf(f)); };
          id(ble_dose).set_value(num(id(dose_steps).state));
          id(ble_override).set_value(num(id(override_steps).state));
          id(ble_low_level).set_value(num(id(low_level_pct).state));
          id(ble_pause).set_value(std::string(id(paused).state ? "1" : "0"));
          id(ble_slots).set_value(str_sprintf("%02u:%02u-%02u:%02u,%02u:%02u-%02u:%02u,%02u:%02u-%02u:%02u",
              id(slot1_start).hour, id(slot1_start).minute, id(slot1_end).hour, id(slot1_end).minute,
              id(slot2_start).hour, id(slot2_start).minute, id(slot2_end).hour, id(slot2_end).minute,
              id(slot3_start).hour, id(slot3_start).minute, id(slot3_end).hour, id(slot3_end).minute));
          id(ble_chip1).set_value(id(chip_1).state);
          auto now = id(sys_time).now();
          std::string clock = now.is_valid() ? now.strftime("%Y-%m-%d %H:%M") : "invalid";
          uint32_t f = id(fed_bits);
          id(ble_status).set_value(str_sprintf("level=%s%%;doses=%s;fed=%c%c%c;paused=%d;time=%s;chip=%s",
              num(id(level_pct).state).c_str(), num(id(doses_left).state).c_str(),
              (f & 1) ? '1' : '0', (f & 2) ? '1' : '0', (f & 4) ? '1' : '0',
              id(paused).state ? 1 : 0, clock.c_str(),
              id(last_chip).has_state() ? id(last_chip).state.c_str() : "-"));

  # Runs at the end of each slot. Slot 3 ends at 23:59:59, before the midnight reset.
  - id: check_missed
    mode: queued
    parameters:
      slot: int
    then:
      - lambda: |-
          if (id(paused).state) return;
          const std::string authorized[] = { id(chip_1).state };
          for (int cat = 0; cat < ${max_cats}; cat++) {
            if (authorized[cat].empty() || (id(fed_bits) & (1u << (cat * 3 + slot)))) continue;
            ESP_LOGW("feeder", "Cat %d missed slot %d", cat, slot + 1);
            id(feeder_event).trigger(str_sprintf("slot_missed_%d", slot + 1));
          }
