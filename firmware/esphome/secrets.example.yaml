# Copy to secrets.yaml (git-ignored) and fill in real values.
# Never commit secrets.yaml.

wifi_ssid: "your-wifi-ssid"
wifi_password: "your-wifi-password"

# Home Assistant native API encryption key (32-byte base64).
# Generate one at https://esphome.io/components/api.html
api_encryption_key: "REPLACE_WITH_BASE64_KEY"

# Static BLE pairing passkey: 6 random digits, printed on the device sticker.
# The build refuses the placeholder 000000.
ble_passkey: "000000"
